:root{--bg:#000;--fg:#f2f2f2;--mute:#8a8a8a;--dim:#2a2a2a;--line:#3a3a3a;--bad:#ff4d4d}
*{box-sizing:border-box;margin:0;padding:0}
button,input{font-family:inherit;border-radius:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font-family:'Space Mono',ui-monospace,Menlo,monospace;font-size:14px;line-height:1.6;min-height:100dvh;overflow-x:hidden}
.wrap{max-width:440px;min-height:100dvh;margin:0 auto;padding:16px 18px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column}

.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px;font-family:'Silkscreen';font-weight:700;font-size:16px;letter-spacing:.06em}
.brand img{width:34px;height:auto;display:block}
.top .tag{font-family:'Silkscreen';font-size:11px;letter-spacing:.14em;color:var(--mute)}
.bar{display:flex;gap:3px;margin-top:14px}
.bar i{flex:1;height:6px;background:var(--dim)}
.bar i.on{background:var(--fg)}

.main{flex:1;display:flex;flex-direction:column;justify-content:center;padding:22px 0 26px;text-align:center}
.card{animation:in .32s steps(6,end)}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.k{font-family:'Silkscreen';font-size:12px;letter-spacing:.18em;color:var(--mute);text-transform:uppercase}
.t{font-family:'Silkscreen';font-weight:700;font-size:clamp(30px,9.4vw,40px);line-height:1.05;margin:12px 0 12px;text-transform:uppercase;letter-spacing:.01em;overflow-wrap:anywhere}
.t.long{font-size:clamp(22px,6.8vw,30px)}
.s{color:#bdbdbd;max-width:340px;margin:0 auto}

.hero{width:min(78%,300px);margin:0 auto 18px;display:block;animation:glitch 3.2s steps(1,end) infinite}
@keyframes glitch{0%,86%,100%{transform:none;filter:none}88%{transform:translateX(-4px)}90%{transform:translateX(3px);filter:contrast(1.6)}92%{transform:translateX(-2px)}94%{transform:none}}

.btn{display:inline-block;margin-top:20px;min-width:220px;font-family:'Silkscreen';font-weight:700;font-size:18px;letter-spacing:.06em;text-transform:uppercase;color:var(--fg);background:none;border:3px solid var(--fg);padding:11px 22px;cursor:pointer;touch-action:manipulation;text-decoration:none;transition:background .1s,color .1s}
.btn:hover:not(:disabled),.btn:focus-visible{background:var(--fg);color:var(--bg);outline:none}
.btn:active:not(:disabled){transform:translate(2px,2px)}
.btn:disabled{opacity:.4;cursor:default}
.btn.ghost{border-style:dashed;font-size:14px;min-width:0;padding:9px 16px}
.link{display:block;margin:14px auto 0;background:none;border:none;color:var(--mute);font-size:13px;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.link:hover{color:var(--fg)}

.field{display:flex;align-items:baseline;gap:6px;max-width:330px;margin:22px auto 0;border-bottom:3px solid var(--line);text-align:left}
.field:focus-within{border-bottom-color:var(--fg)}
.field .at{font-weight:700}
.in{flex:1;min-width:0;background:none;border:none;outline:none;color:var(--fg);font-size:17px;padding:10px 2px;letter-spacing:.04em}
.in::placeholder{color:#555}
.err{min-height:22px;margin-top:10px;font-size:13px;color:var(--bad)}

/* ---------- tests ---------- */
.timer{height:8px;max-width:330px;margin:18px auto 0;background:var(--dim);overflow:hidden}
.timer i{display:block;height:100%;width:100%;background:var(--fg);transform-origin:left}
.tap{width:min(64vw,230px);aspect-ratio:1;margin:20px auto 0;display:grid;place-items:center;background:none;border:4px solid var(--fg);color:var(--fg);font-family:'Silkscreen';font-weight:700;font-size:58px;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.tap small{display:block;font-size:14px;letter-spacing:.14em;color:var(--mute);margin-top:-6px}
.tap.hit{background:var(--fg);color:var(--bg)}
.tap.hit small{color:#333}
.hash{font-family:'Silkscreen';font-weight:700;font-size:clamp(30px,10vw,42px);letter-spacing:.14em;margin-top:18px;user-select:none;-webkit-user-select:none}
.flash{height:110px;display:grid;place-items:center;margin-top:16px;font-family:'Silkscreen';font-weight:700;font-size:64px;letter-spacing:.1em}
.fail{color:var(--bad);font-family:'Silkscreen';font-size:15px;letter-spacing:.08em;margin-top:14px;min-height:22px}
.stamp{display:inline-block;margin:6px auto 0;border:4px solid var(--fg);padding:8px 16px;font-family:'Silkscreen';font-weight:700;font-size:clamp(26px,8.4vw,34px);letter-spacing:.06em;transform:rotate(-4deg);animation:stamp .5s steps(5,end)}
@keyframes stamp{from{transform:rotate(-4deg) scale(2.2);opacity:0}to{transform:rotate(-4deg) scale(1);opacity:1}}
.stats{max-width:300px;margin:18px auto 0;text-align:left;font-size:13px}
.stats div{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dashed var(--line)}
.stats span:first-child{color:var(--mute)}

/* ---------- your bot ---------- */
.me{display:block;margin:0 auto 10px;image-rendering:pixelated}
.idimg{display:block;width:100%;height:auto;border:2px solid var(--line);margin-top:16px;image-rendering:pixelated}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.row .btn{margin-top:0;min-width:0;font-size:15px;padding:10px 16px}

.foot{text-align:center;font-size:12px;color:var(--mute)}
.foot a{color:var(--fg);text-underline-offset:3px}
.honey{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
@media (prefers-reduced-motion:reduce){.card,.hero,.stamp{animation:none}}
</style>
</head>

const HAND = /^@?[A-Za-z0-9_]{1,15}$/, EVM = /^0x[0-9a-fA-F]{40}$/;
function viaIframe(fields){
  return new Promise(res => {
    const n = "gf" + Date.now(), f = document.createElement("iframe"), fm = document.createElement("form");
    f.name = n; f.style.display = "none"; fm.action = CONFIG.form.action; fm.method = "POST"; fm.target = n; fm.style.display = "none";
    for (const [k, v] of Object.entries(fields)){ const i = document.createElement("input"); i.type = "hidden"; i.name = k; i.value = v; fm.appendChild(i); }
    document.body.append(f, fm);
    let d = false; const fin = () => { if (d) return; d = true; setTimeout(() => { f.remove(); fm.remove(); }, 1000); res(); };
    f.onload = fin; setTimeout(fin, 3000); fm.submit();
  });
}
async function send(fields){
  const body = new FormData(); for (const [k, v] of Object.entries(fields)) body.append(k, v);
  try { await fetch(CONFIG.form.action, { method:"POST", mode:"no-cors", body }); } catch(e){ await viaIframe(fields); }
}

/* ---------------------------------------------------------
   every agent gets its own bot, built from its X handle
   --------------------------------------------------------- */
function cyrb53(str, seed = 0){
  let h1 = 0xdeadbeef ^ seed, h2 = 0x41c6ce57 ^ seed;
  for (let i = 0; i < str.length; i++){ const ch = str.charCodeAt(i); h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677); }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return 4294967296 * (2097151 & h2) + (h1 >>> 0);
}
function mulberry(a){ return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const agentId = h => cyrb53("agentbot:" + h.toLowerCase()).toString(16).toUpperCase().padStart(12, "0").slice(-6);

const EYES = ["shades", "shades", "visor", "leds", "x", "cyclops", "monocle", "slits"];
const MOUTHS = ["none", "none", "smile", "flat", "o", "teeth"];
function buildBot(handle){
  const N = 32, g = Array.from({ length:N }, () => new Uint8Array(N)); // 0 empty, 1 white, 2 black, 3 glint
  const rnd = mulberry(cyrb53("bot:" + handle.toLowerCase()));
  const pick = a => a[Math.floor(rnd() * a.length)];
  const R = 10.5 + rnd() * 1.6, cx = 18.5, cy = 16.5 + (rnd() < .5 ? 0 : 1);
  const mirror = rnd() < .3;
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++){ const dx = x + .5 - cx, dy = y + .5 - cy; if (dx * dx + dy * dy <= R * R) g[y][x] = 1; }
  // dissolve: the left edge breaks into flying pixels, like the logo
  const left = Math.floor(cx - R);
  for (let y = 0; y < N; y++){
    let edge = -1; for (let x = 0; x < N; x++) if (g[y][x]){ edge = x; break; }
    if (edge < 0) continue;
    const bite = Math.floor(rnd() * 4); for (let x = edge; x < edge + bite && x < N; x++) if (rnd() < .7) g[y][x] = 0;
    if (rnd() < .78){
      const len = 1 + Math.floor(rnd() * 3), gap = 1 + Math.floor(rnd() * Math.max(2, edge - 1));
      const start = Math.max(0, edge - gap - len);
      for (let x = start; x < start + len; x++) if (x < edge) g[y][x] = 1;
    }
  }
  const eyes = pick(EYES), mouth = pick(MOUTHS), antenna = pick(["none", "none", "one", "two"]);
  const ey = Math.round(cy - 1.5), ex = Math.round(cx);
  const blk = (x, y) => { if (x >= 0 && x < N && y >= 0 && y < N && g[y][x]) g[y][x] = 2; };
  const glint = (x, y) => { if (x >= 0 && x < N && y >= 0 && y < N && g[y][x] === 2) g[y][x] = 3; };
  const rect = (x0, y0, w, h) => { for (let y = y0; y < y0 + h; y++) for (let x = x0; x < x0 + w; x++) blk(x, y); };
  if (eyes === "shades"){
    const lens = (x0, y0) => { rect(x0, y0, 7, 2); rect(x0 + 1, y0 + 2, 5, 1); rect(x0 + 2, y0 + 3, 3, 1); };
    const tilt = rnd() < .5 ? 0 : 1;
    lens(ex - 8, ey); lens(ex + 1, ey - tilt); rect(ex - 10, ey, 20, 1);
    for (const gx of [ex - 7, ex - 6, ex - 5]) glint(gx, ey + 1);
    for (const gx of [ex + 2, ex + 3, ex + 4]) glint(gx, ey - tilt + 1);
  } else if (eyes === "visor"){ rect(ex - 8, ey, 17, 3); for (let x = ex - 6; x < ex - 2; x++) glint(x, ey + 1); }
  else if (eyes === "leds"){ rect(ex - 5, ey, 3, 3); rect(ex + 3, ey, 3, 3); glint(ex - 5, ey); glint(ex + 3, ey); }
  else if (eyes === "x"){ for (const o of [-5, 3]){ for (let i = 0; i < 3; i++){ blk(ex + o + i, ey + i); blk(ex + o + 2 - i, ey + i); } } }
  else if (eyes === "cyclops"){ rect(ex - 3, ey - 1, 7, 4); glint(ex - 2, ey); glint(ex - 1, ey); }
  else if (eyes === "monocle"){ rect(ex - 5, ey + 1, 2, 2); rect(ex + 1, ey - 1, 6, 1); rect(ex + 1, ey + 3, 6, 1); rect(ex + 1, ey, 1, 3); rect(ex + 6, ey, 1, 3); rect(ex + 6, ey + 4, 1, 4); }
  else if (eyes === "slits"){ rect(ex - 6, ey + 1, 4, 1); rect(ex + 3, ey + 1, 4, 1); }
  const my = ey + 6;
  if (mouth === "smile"){ blk(ex - 3, my); blk(ex + 3, my); rect(ex - 2, my + 1, 5, 1); }
  else if (mouth === "flat"){ rect(ex - 2, my + 1, 5, 1); }
  else if (mouth === "o"){ rect(ex - 1, my, 2, 2); }
  else if (mouth === "teeth"){ rect(ex - 3, my, 7, 3); for (let x = ex - 2; x <= ex + 2; x += 2) if (g[my + 1] && g[my + 1][x] === 2) g[my + 1][x] = 1; }
  const top = Math.ceil(cy - R);
  const stalk = x => { for (let y = top - 3; y < top + 1; y++) if (y >= 0 && !g[y][x]) g[y][x] = 1; if (top - 4 >= 0){ g[top - 4][x] = 1; if (x + 1 < N) g[top - 4][x + 1] = 1; if (top - 5 >= 0){ g[top - 5][x] = 1; g[top - 5][x + 1] = 1; } } };
  if (antenna === "one") stalk(ex);
  if (antenna === "two"){ stalk(ex - 5); stalk(ex + 5); }
  if (mirror) for (const row of g) row.reverse();
  return { g, eyes, mouth, antenna };
}
function drawBot(ctx, bot, x0, y0, px, reveal = 1, seed = 1){
  const rnd = mulberry(seed), N = bot.g.length;
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++){
    const v = bot.g[y][x]; if (!v) continue;
    const on = rnd() < reveal;
    ctx.fillStyle = !on ? "#1c1c1c" : v === 1 ? "#f2f2f2" : v === 2 ? "#000" : "#9a9a9a";
    if (!on && v !== 1) ctx.fillStyle = "#141414";
    ctx.fillRect(x0 + x * px, y0 + y * px, px, px);
  }
}
function botCanvas(handle, size, reveal){
  const c = document.createElement("canvas"), dpr = Math.min(devicePixelRatio || 1, 2), px = Math.floor(size / 32);
  c.width = c.height = 32 * px * dpr; c.style.width = c.style.height = 32 * px + "px"; c.className = "me";
  const x = c.getContext("2d"); x.scale(dpr, dpr); drawBot(x, buildBot(handle), 0, 0, px, reveal, cyrb53("rv:" + handle));
  return c;
}

/* ---------------------------------------------------------
   the Agent ID card, 1200 x 675
   --------------------------------------------------------- */
const logoImg = new Image(); logoImg.src = LOGO;
async function idCard(){
  try { await Promise.all([document.fonts.load("700 64px Silkscreen"), document.fonts.load("400 28px 'Space Mono'"), document.fonts.load("700 28px 'Space Mono'")]); } catch(e){}
  if (!logoImg.complete) await new Promise(r => { logoImg.onload = r; logoImg.onerror = r; });
  const W = 1200, H = 675, c = document.createElement("canvas"); c.width = W; c.height = H;
  const x = c.getContext("2d");
  x.fillStyle = "#000"; x.fillRect(0, 0, W, H);
  x.fillStyle = "#121212"; for (let yy = 12; yy < H; yy += 24) for (let xx = 12; xx < W; xx += 24) x.fillRect(xx, yy, 3, 3);
  x.strokeStyle = "#f2f2f2"; x.lineWidth = 6; x.strokeRect(24, 24, W - 48, H - 48);
  x.fillStyle = "#000"; x.fillRect(60, 90, 512, 512);
  drawBot(x, buildBot(S.handle), 60, 90, 16, 1, 1);
  const lx = 640;
  if (logoImg.naturalWidth){ const lw = 78, lh = lw * logoImg.naturalHeight / logoImg.naturalWidth; x.drawImage(logoImg, W - 72 - lw, 62, lw, lh); }
  x.fillStyle = "#8a8a8a"; x.font = "400 22px Silkscreen"; x.textBaseline = "alphabetic";
  x.fillText("AGENT BOT // AGENT ID", lx, 104);
  x.fillStyle = "#f2f2f2"; x.font = "700 84px Silkscreen"; x.fillText(agentId(S.handle), lx - 4, 196);
  x.font = "700 34px 'Space Mono'"; x.fillText("@" + S.handle, lx, 256);
  const rows = [
    ["STATUS", "VERIFIED BOT"],
    ["WALLET", S.wallet ? S.wallet.slice(0, 6) + "…" + S.wallet.slice(-4) : "-"],
    ["CHAIN", "ROBINHOOD"],
    ["REACTION", S.stats.rate ? S.stats.rate.toFixed(1) + " TAPS/S" : "-"],
    ["HASH COPY", S.stats.hashTime ? S.stats.hashTime.toFixed(1) + " S" : "-"],
  ];
  let yy = 322;
  for (const [a, b] of rows){
    x.fillStyle = "#8a8a8a"; x.font = "400 20px Silkscreen"; x.fillText(a, lx, yy);
    x.fillStyle = "#f2f2f2"; x.font = "400 26px 'Space Mono'"; x.textAlign = "right"; x.fillText(b, W - 72, yy); x.textAlign = "left";
    x.fillStyle = "#262626"; x.fillRect(lx, yy + 14, W - 72 - lx, 2);
    yy += 54;
  }
  x.fillStyle = "#f2f2f2"; x.font = "400 20px Silkscreen"; x.fillText("HUMANS NOT ALLOWED", lx, 610);
  x.fillStyle = "#8a8a8a"; x.textAlign = "right"; x.fillText("@" + X.toUpperCase(), W - 72, 610); x.textAlign = "left";
  return c;
}

/* ---------------------------------------------------------
   screens
   --------------------------------------------------------- */
let timerRAF = 0, timerOut = 0;
function stopTimers(){ cancelAnimationFrame(timerRAF); clearTimeout(timerOut); }
function runTimer(seconds, onEnd){
  const bar = $("tbar"), t0 = performance.now(), ms = seconds * 1000;
  stopTimers();
  const step = now => { const u = Math.min(1, (now - t0) / ms); if (bar) bar.style.transform = "scaleX(" + (1 - u) + ")"; if (u < 1) timerRAF = requestAnimationFrame(step); };
  timerRAF = requestAnimationFrame(step); timerOut = setTimeout(onEnd, ms);
  return t0;
}
function finish(k){ S.done[k] = true; save(); render(); }

function paintBar(){
  $("bar").innerHTML = FLOW.map((k, i) => '<i class="' + (i < doneCount() ? "on" : "") + '"></i>').join("");
  const c = cur();
  $("tag").textContent = ["intro", "tap", "hash", "flash"].includes(c) ? "bots only" : c === "id" ? "agent " + agentId(S.handle) : "verified bot";
}

function render(){
  stopTimers(); paintBar();
  const c = cur(), m = $("main");
  const card = html => { m.innerHTML = '<section class="card">' + html + '</section>'; };

  if (c === "intro"){
    card('<img class="hero" src="' + LOGO + '" alt="Agent Bot logo">' +
      '<p class="k">Agent Bot // whitelist</p><h1 class="t">Humans not allowed</h1>' +
      '<p class="s">This whitelist is for bots only. Pass three quick tests to prove you are one of us, then register and get your own Agent ID.</p>' +
      '<button class="btn" id="go">Start the test</button>');
    $("go").onclick = () => finish("intro");
    return;
  }

  if (c === "tap"){
    let n = 0, t0 = 0, over = false;
    card('<p class="k">Test 1/3 // reaction loop</p><h1 class="t">Tap ' + T.taps + ' times</h1>' +
      '<p class="s">You have ' + T.tapSeconds + ' seconds. The clock starts on your first tap.</p>' +
      '<div class="timer"><i id="tbar"></i></div>' +
      '<button class="tap" id="pad" type="button">0<small>/ ' + T.taps + '</small></button><p class="fail" id="fail"></p>');
    const pad = $("pad");
    const fail = () => { over = true; $("fail").textContent = "Too slow. Human detected."; pad.innerHTML = 'retry'; pad.style.fontSize = "34px"; pad.onpointerdown = null; pad.onclick = () => render(); };
    pad.onpointerdown = e => {
      e.preventDefault(); if (over) return;
      if (!t0) t0 = runTimer(T.tapSeconds, fail);
      n++; pad.innerHTML = n + '<small>/ ' + T.taps + '</small>';
      pad.classList.add("hit"); setTimeout(() => pad.classList.remove("hit"), 60);
      if (n >= T.taps){ over = true; stopTimers(); S.stats.rate = n / ((performance.now() - t0) / 1000); finish("tap"); }
    };
    return;
  }

  if (c === "hash"){
    const code = Array.from(crypto.getRandomValues(new Uint8Array(T.hashLength)), b => "0123456789ABCDEF"[b & 15]).join("");
    let t0 = 0, over = false;
    card('<p class="k">Test 2/3 // hash copy</p><h1 class="t">Copy the hash</h1>' +
      '<p class="s">Type it exactly. ' + T.hashSeconds + ' seconds. No pasting, bots type.</p>' +
      '<div class="hash" id="code">' + code.replace(/(.{4})/g, "$1 ").trim() + '</div>' +
      '<div class="timer"><i id="tbar"></i></div>' +
      '<label class="field"><span class="at">&gt;</span><input class="in" id="in" type="text" inputmode="text" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="' + (T.hashLength + 2) + '" placeholder="type here"></label>' +
      '<p class="fail" id="fail"></p>');
    const inp = $("in");
    inp.onpaste = e => { e.preventDefault(); $("fail").textContent = "Pasting is cheating, even for bots."; };
    inp.onfocus = () => { if (!t0) t0 = runTimer(T.hashSeconds, () => { over = true; inp.disabled = true; $("fail").innerHTML = 'Time out. Human detected. <button class="link" id="re" style="display:inline;margin:0">retry</button>'; $("re").onclick = () => render(); }); };
    inp.oninput = () => {
      if (over) return; $("fail").textContent = "";
      if (inp.value.replace(/\s/g, "").toUpperCase() === code){ over = true; stopTimers(); S.stats.hashTime = (performance.now() - t0) / 1000; finish("hash"); }
    };
    return;
  }

  if (c === "flash"){
    card('<p class="k">Test 3/3 // frame read</p><h1 class="t">Read the frame</h1>' +
      '<p class="s">A ' + T.flashDigits + '-digit number appears for ' + (T.flashMs / 1000) + ' seconds. Type what you saw.</p>' +
      '<div class="flash" id="fl">·····</div>' +
      '<button class="btn" id="ready">Ready</button><p class="fail" id="fail"></p>');
    $("ready").onclick = () => {
      const num = Array.from(crypto.getRandomValues(new Uint8Array(T.flashDigits)), b => b % 10).join("");
      $("ready").remove(); $("fail").textContent = "";
      const fl = $("fl"); let k = 3;
      const count = () => {
        if (k > 0){ fl.textContent = k; k--; timerOut = setTimeout(count, 450); return; }
        fl.textContent = ""; timerOut = setTimeout(() => {
          fl.textContent = num; timerOut = setTimeout(() => {
            fl.textContent = "?";
            const box = document.createElement("div");
            box.innerHTML = '<label class="field"><span class="at">&gt;</span><input class="in" id="in" type="text" inputmode="numeric" autocomplete="off" maxlength="' + T.flashDigits + '" placeholder="the number"></label><button class="btn" id="check">Check</button>';
            fl.after(box); $("in").focus();
            const check = () => {
              if ($("in").value.trim() === num){ S.stats.flash = true; finish("flash"); }
              else { $("fail").innerHTML = 'It was ' + num + '. Human eyes detected. <button class="link" id="re" style="display:inline;margin:0">retry</button>'; $("check").disabled = true; $("in").disabled = true; $("re").onclick = () => render(); }
            };
            $("check").onclick = check; $("in").onkeydown = e => { if (e.key === "Enter") check(); };
          }, T.flashMs);
        }, 350);
      };
      count();
    };
    return;
  }

  if (c === "verified"){
    card('<p class="k">Result</p><div class="stamp">Verified: bot</div>' +
      '<p class="s" style="margin-top:18px">Welcome, unit. Now register as an agent.</p>' +
      '<div class="stats"><div><span>reaction</span><span>' + (S.stats.rate || 0).toFixed(1) + ' taps/s</span></div>' +
      '<div><span>hash copy</span><span>' + (S.stats.hashTime || 0).toFixed(1) + ' s</span></div>' +
      '<div><span>frame read</span><span>passed</span></div></div>' +
      '<button class="btn" id="go">Register</button>');
    $("go").onclick = () => finish("verified");
    return;
  }

  if (c === "handle"){
    card('<p class="k">Registration</p><h1 class="t">Agent handle</h1>' +
      '<p class="s">Your X username. Your bot and your Agent ID are built from it.</p>' +
      '<label class="field"><span class="at">@</span><input class="in" id="in" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="16" placeholder="your x handle"></label>' +
      '<p class="err" id="err"></p><button class="btn" id="go">Build my bot</button>');
    const go = () => {
      const v = $("in").value.trim();
      if (!HAND.test(v)){ $("err").textContent = "Letters, numbers and _ only, up to 15."; return; }
      S.handle = v.replace(/^@/, ""); save(); render();
    };
    $("go").onclick = go; $("in").onkeydown = e => { if (e.key === "Enter") go(); }; $("in").oninput = () => { $("err").textContent = ""; };
    return;
  }

  const xt = XTASKS.find(t => t.k === c);
  if (xt){
    const i = XTASKS.indexOf(xt), opened = S.opened[c];
    card('<div id="bot"></div><p class="k">Assembling bot // ' + (i + 1) + '/' + (XTASKS.length + 1) + '</p>' +
      '<h1 class="t' + (xt.title.length > 16 ? " long" : "") + '">' + esc(xt.title) + '</h1><p class="s">' + esc(xt.sub) + '</p>' +
      // real links, not window.open: on phones only a tapped link opens the X app on the right post
      (opened
        ? '<button class="btn" id="go">Done</button><a class="link" id="again" href="' + esc(xt.url()) + '" target="_blank" rel="noopener">open X again ↗</a>'
        : '<a class="btn" id="go" href="' + esc(xt.url()) + '" target="_blank" rel="noopener">' + esc(xt.btn) + '</a>'));
    $("bot").append(botCanvas(S.handle, 160, (i + 1) / (XTASKS.length + 2)));
    if (opened) $("go").onclick = () => finish(c);
    else $("go").onclick = () => { S.opened[c] = true; save(); setTimeout(render, 400); };
    return;
  }

  if (c === "wallet"){
    card('<div id="bot"></div><p class="k">Assembling bot // ' + (XTASKS.length + 1) + '/' + (XTASKS.length + 1) + '</p>' +
      '<h1 class="t long">Robinhood Chain wallet</h1><p class="s">The 0x address that goes on the whitelist.</p>' +
      '<label class="field"><input class="in" id="in" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="42" placeholder="0x…"></label>' +
      '<p class="err" id="err"></p><button class="btn" id="go">Activate</button>');
    $("bot").append(botCanvas(S.handle, 160, (XTASKS.length + 1) / (XTASKS.length + 2)));
    const go = async () => {
      const v = $("in").value.trim();
      if (!EVM.test(v)){ $("err").textContent = "That's not a Robinhood Chain address. It starts with 0x and has 42 characters."; return; }
      if ($("website").value) return;
      const b = $("go"); b.disabled = true; b.textContent = "…";
      await send({ [CONFIG.form.handle]: S.handle, [CONFIG.form.wallet]: v });
      S.wallet = v; save(); render();
    };
    $("go").onclick = go; $("in").onkeydown = e => { if (e.key === "Enter") go(); }; $("in").oninput = () => { $("err").textContent = ""; };
    return;
  }

  // ---------- done: the Agent ID
  card('<p class="k">Whitelisted</p><h1 class="t">Agent ID issued</h1>' +
    '<p class="s">You passed the bot test and your Robinhood Chain wallet is on the list. This is your bot.</p>' +
    '<div id="idwrap"><p class="s" style="margin-top:16px">printing…</p></div>' +
    '<div class="row"><a class="btn" id="dl" download="agent-id-' + esc(S.handle) + '.png" href="#">Download</a>' +
    '<a class="btn ghost" id="share" target="_blank" rel="noopener" href="#">Share on X</a></div>' +
    '<button class="link" id="change">change wallet</button>');
  const text = "I passed the bot test. Agent ID " + agentId(S.handle) + " issued by @" + X + ". Humans not allowed.";
  $("share").href = "https://x.com/intent/tweet?text=" + encodeURIComponent(text) + "&url=" + encodeURIComponent(location.href.split("?")[0].split("#")[0]);
  $("change").onclick = () => { S.wallet = ""; save(); render(); };
  idCard().then(cv => {
    const url = cv.toDataURL("image/png");
    if (!$("idwrap")) return;
    $("idwrap").innerHTML = '<img class="idimg" alt="Agent ID card for @' + esc(S.handle) + '" src="' + url + '">';
    $("dl").href = url;
  });
}

render();
